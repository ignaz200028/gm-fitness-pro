:root{--bg:#f3f4f6;--card:#fff;--ink:#111318;--muted:#737983;--line:#e3e5e8;--accent:#e30613;--green:#0a8f55;--dark:#0b0c0e;--shadow:0 8px 30px rgba(0,0,0,.06)}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit}button{cursor:pointer}

.appbar .top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:20px;font-weight:900;letter-spacing:-.4px}.sub{font-size:11px;color:#aeb2b8;margin-top:2px}
.container{max-width:760px;margin:auto;padding:14px 14px 24px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:4px;backdrop-filter:blur(18px)}
.bottom button{border:0;background:transparent;color:#70747b;padding:7px 3px;border-radius:12px;font-size:10px;font-weight:800}.bottom button b{display:block;font-size:18px;line-height:18px;margin-bottom:2px}.bottom button.active{color:var(--ink);background:#f0f1f3}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero{background:linear-gradient(135deg,#101114,#24262b);color:#fff;border:0}.hero h1{font-size:27px;margin:0 0 6px;letter-spacing:-.7px}.hero p{margin:0;color:#c5c8cd;font-size:13px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1}
h2{font-size:19px;letter-spacing:-.3px;margin:0 0 12px}h3{font-size:16px;margin:0 0 5px}.muted{color:var(--muted);font-size:12px;line-height:1.45}
.btn{border:0;border-radius:12px;padding:10px 13px;background:var(--dark);color:#fff;font-weight:800}.btn.light{background:#eef0f2;color:#17191d}.btn.red{background:var(--accent)}.btn.green{background:var(--green)}.btn.small{padding:7px 9px;font-size:12px}

.progress{height:8px;background:#e8eaed;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}
.search{position:relative;margin-bottom:10px}.search input{padding-left:40px}.search span{position:absolute;left:13px;top:10px;color:#858990}
.exercise-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}.exercise-row:last-child{border-bottom:0}

.workout-card{padding:14px 0;border-bottom:1px solid var(--line)}.workout-card:last-child{border-bottom:0}

.set-row input{padding:9px 7px;text-align:center}.check{width:28px;height:28px;accent-color:var(--green);justify-self:center}
.exercise-title{display:flex;gap:11px;align-items:center;margin-bottom:10px}.exercise-title .thumb{width:42px;height:42px;flex-basis:42px}
.prev{background:#f6f7f8;border-radius:13px;padding:9px 10px;margin:8px 0;font-size:12px}.prev b{font-size:13px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 15px calc(24px + env(safe-area-inset-bottom))}.handle{width:42px;height:5px;background:#d3d5d8;border-radius:99px;margin:0 auto 15px}

canvas{width:100%;height:210px;border:1px solid var(--line);border-radius:14px;background:#fff}
.timer{font-size:42px;font-weight:950;text-align:center;letter-spacing:1px;margin:6px 0 12px}

async function saveLibraryExercise(oldName){const base=allExercises().find(e=>e.name===oldName);if(!base)return;const custom=state.customExercises.find(e=>e.name===oldName);const newName=custom?(document.getElementById('leName')?.value||oldName).trim():oldName;if(!newName)return;if(custom&&newName!==oldName&&state.customExercises.some(e=>e.name===newName)){toast('Esiste già un esercizio con questo nome');return;}if(custom){custom.name=newName;custom.muscle=document.getElementById('leMuscle').value.trim()||'Altro';custom.equipment=document.getElementById('leEq').value.trim()||'Personalizzato';if(state.exerciseMeta[oldName]){state.exerciseMeta[newName]=state.exerciseMeta[oldName];delete state.exerciseMeta[oldName];}}else{state.exerciseMeta[oldName]=state.exerciseMeta[oldName]||{};}state.exerciseMeta[newName]=state.exerciseMeta[newName]||{};state.exerciseMeta[newName].note=document.getElementById('leNote').value.trim();const file=document.getElementById('leImage')?.files?.[0];if(file)state.exerciseMeta[newName].image=await resizeImageFile(file);save();closeModal();renderLibrary();toast('Esercizio personalizzato');}
function clearLibraryExerciseImage(name){if(state.exerciseMeta[name])delete state.exerciseMeta[name].image;save();editLibraryExercise(name);}
function deleteCustomExercise(name){const idx=state.customExercises.findIndex(e=>e.name===name);if(idx<0)return;if(!confirm('Eliminare questo esercizio personalizzato dalla libreria?'))return;state.customExercises.splice(idx,1);delete state.exerciseMeta[name];save();closeModal();renderLibrary();toast('Esercizio eliminato');}
function newExercise(){document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="sheet"><div class="handle"></div><h2>Nuovo esercizio</h2><input id="ceName" placeholder="Nome esercizio"><select id="ceMuscle" style="margin-top:8px"><option>Petto</option><option>Dorso</option><option>Gambe</option><option>Spalle</option><option>Bicipiti</option><option>Tricipiti</option><option>Addome</option><option>Altro</option></select><input id="ceEq" placeholder="Attrezzatura" style="margin-top:8px"><textarea id="ceNote" rows="3" style="margin-top:8px" placeholder="Note personali / esecuzione"></textarea><div style="margin-top:8px"><span class="mini-label">Immagine</span><input id="ceImage" type="file" accept="image/*"></div><div class="row" style="margin-top:10px"><button class="btn light grow" onclick="closeModal()">Annulla</button><button class="btn green grow" onclick="createExercise()">Salva</button></div></div></div>`;}
async function createExercise(){const n=document.getElementById('ceName').value.trim();if(!n)return;const id='custom'+Date.now();state.customExercises.push({id,name:n,muscle:document.getElementById('ceMuscle').value,equipment:document.getElementById('ceEq').value||'Personalizzato'});state.exerciseMeta[n]={note:document.getElementById('ceNote').value.trim(),image:await resizeImageFile(document.getElementById('ceImage').files[0])};save();closeModal();renderLibrary();toast('Esercizio aggiunto');}

function personalRecords(){const out={};state.logs.filter(x=>x.done&&x.weight).forEach(x=>{const k=x.exercise,score=Number(x.weight)*(1+(Number(x.reps)||0)/30);if(!out[k]||score>out[k].score)out[k]={score,x};});return Object.values(out).map(v=>v.x);}
function recentSessions(){const by={};state.logs.filter(x=>x.done).forEach(x=>{const k=x.date+'|'+x.program+'|'+x.workout;(by[k]??=[]).push(x);});return Object.entries(by).map(([k,a])=>{const [date,program,workout]=k.split('|');return {date,program,workout,count:a.length,volume:a.reduce((s,x)=>s+(Number(x.weight)||0)*(Number(x.reps)||0),0)}}).sort((a,b)=>b.date.localeCompare(a.date));}
function renderProgress(){const prs=personalRecords().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));document.getElementById('progress').innerHTML=`<div class="section-title"><h2>Progressi</h2></div><div class="kpis"><div class="kpi"><div class="n">${state.logs.filter(x=>x.done).length}</div><div class="l">Serie</div></div><div class="kpi"><div class="n">${recentSessions().length}</div><div class="l">Allenamenti</div></div><div class="kpi"><div class="n">${prs.length}</div><div class="l">PR esercizi</div></div></div><div class="section-title"><h2>Record personali</h2></div><div class="card">${prs.slice(0,30).map(x=>`<div class="exercise-row" onclick="openExercise('${esc(x.exercise)}')"><div class="thumb">${thumb(x.exercise)}</div><div class="exercise-main"><strong>${esc(x.exercise)}</strong><div class="meta">${fmtDate(x.date)} · ${x.weight||'—'} kg × ${x.reps||'—'}</div></div><div class="chip red">PR</div></div>`).join('')||'<div class="empty">I tuoi PR compariranno qui.</div>'}</div><div class="section-title"><h2>Storico allenamenti</h2></div><div class="card">${recentSessions().slice(0,30).map(s=>`<div class="history-item"><div class="row between"><b>${fmtDate(s.date)}</b><span class="chip">${esc(s.workout)}</span></div><div class="muted">${esc(s.program)} · ${s.count} serie · ${s.volume.toFixed(0)} kg volume</div></div>`).join('')||'<div class="empty">Nessun allenamento registrato.</div>'}</div>`;}
function openWorkoutImport(){
  document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="sheet"><div class="handle"></div><div class="row between"><div><h2>Importa scheda da foto</h2><div class="muted">Scatta una foto oppure scegli un’immagine dalla galleria.</div></div><button class="btn light small" onclick="closeModal()">Chiudi</button></div>
  <div class="card" style="margin-top:10px"><div class="row" style="gap:8px"><label class="btn red grow" style="display:block;text-align:center;cursor:pointer">📷 Scatta foto<input id="ocrCamera" type="file" accept="image/*" capture="environment" onchange="runWorkoutOCR(this.files[0])" style="display:none"></label><label class="btn light grow" style="display:block;text-align:center;cursor:pointer">🖼️ Scegli dalla galleria<input id="ocrGallery" type="file" accept="image/*" onchange="runWorkoutOCR(this.files[0])" style="display:none"></label></div><div id="ocrStatus" class="muted" style="margin-top:10px">Scegli se scattare una nuova foto oppure caricare una scheda già presente nella galleria/File. La lettura automatica può essere corretta manualmente prima del salvataggio.</div><div class="ocr-progress"><i id="ocrBar"></i></div></div>
  <div id="ocrPreview"></div><div id="ocrReview"></div></div></div>`;
}
async function loadTesseract(){
  if(window.Tesseract)return window.Tesseract;
  await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js';sc.onload=resolve;sc.onerror=()=>reject(new Error('Impossibile caricare il motore OCR'));document.head.appendChild(sc);});
  return window.Tesseract;
}
function ocrStatus(msg,pct){const el=document.getElementById('ocrStatus');if(el)el.textContent=msg;const bar=document.getElementById('ocrBar');if(bar)bar.style.width=Math.max(0,Math.min(100,pct||0))+'%';}
function normOCR(s){return String(s||'').replace(/[×✕]/g,'x').replace(/[–—−]/g,'-').replace(/[“”]/g,'"').replace(/[’]/g,"'").replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();}
function cleanExerciseName(s){return normOCR(s).replace(/^[•·▪◦\-–—]+\s*/,'').replace(/\s{2,}/g,' ').trim();}
function restFromText(s){const x=String(s||'');let m=x.match(/(?:recupero|rec|rest)\s*[:.]?\s*(\d{1,2}\s*:\s*\d{2})(?:\s*[-–]\s*(\d{1,2}\s*:\s*\d{2}))?/i);if(m)return m[0].replace(/.*?([0-9]{1,2}\s*:\s*[0-9]{2}).*/,'$1').replace(/\s/g,'');m=x.match(/(?:recupero|rec|rest)\s*[:.]?\s*(\d{1,3})\s*(?:s|sec|secondi|')?/i);if(m)return `${m[1]} s`;m=x.match(/(\d{1,2}\s*:\s*\d{2})/);return m?m[1].replace(/\s/g,''):'';}
function parseExerciseLine(raw){
  const line=normOCR(raw); if(!line)return null;
  let rest=restFromText(line); let tech='';
  const techMatch=line.match(/(?:drop\s*set|rest\s*[- ]?pause|superset|negative|eccentrica|lento|contrazione|isometria|tempo|ultima[^,;]*)/i); if(techMatch)tech=techMatch[0].trim();
  let m=line.match(/(\d{1,2})\s*[x*]\s*(\d{1,3})(?:\s*[-/]\s*(\d{1,3}))?/i);
  if(!m)m=line.match(/(\d{1,2})\s*(?:serie|set)\s*(?:da|x)?\s*(\d{1,3})(?:\s*[-/]\s*(\d{1,3}))?/i);
  if(!m)m=line.match(/(?:serie|set)\s*[:=]?\s*(\d{1,2}).*?(\d{1,3})(?:\s*[-/]\s*(\d{1,3}))?\s*(?:rip|reps|ripetizioni)?/i);
  let sets=3,min=8,max=12;
  if(m){sets=Math.max(1,Math.min(50,parseInt(m[1],10)));min=parseInt(m[2],10);max=m[3]?parseInt(m[3],10):min;}
  let name=line;
  if(m)name=name.replace(m[0],' ');
  name=name.replace(/(?:recupero|rec|rest)\s*[:.]?\s*\d{1,2}\s*:\s*\d{2}(?:\s*[-–]\s*\d{1,2}\s*:\s*\d{2})?/ig,' ').replace(/(?:recupero|rec|rest)\s*[:.]?\s*\d{1,3}\s*(?:s|sec|secondi|')?(?:\s*[-–]\s*\d{1,3}\s*(?:s|sec|secondi|')?)?/ig,' ').replace(/\b\d{1,2}\s*:\s*\d{2}\b/g,' ');
  name=name.replace(/\s{2,}/g,' ').replace(/[|;,:-]+\s*$/,'').trim();
  if(!name || name.length<2)return null;
  const lower=name.toLowerCase();
  if(/^(allenamento|workout|giorno|day|scheda|programma|esercizi?|serie|ripetizioni|recupero|riscaldamento)\b/i.test(lower))return null;
  if(!m && !/[a-zàèéìòù]{3}/i.test(name))return null;
  return {name:cleanExerciseName(name),sets,min,max,rest:rest||'1:30',tech,note:'',needsReview:!m};
}
function isWorkoutHeading(line){const x=normOCR(line);return /^(?:allenamento|workout|giorno|day)\s*[0-9a-zàèéìòù-]*/i.test(x)||/^(?:scheda|programma)\s*[:#-]?\s*(?:allenamento|workout|giorno)\b/i.test(x);}
function bestExerciseName(raw){
  const q=cleanExerciseName(raw).toLowerCase(); if(!q)return raw;
  const norm=x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
  const qq=new Set(norm(q).split(' ').filter(Boolean)); let best={name:q,score:0};
  allExercises().forEach(e=>{const tt=new Set(norm(e.name).split(' ').filter(Boolean));const inter=[...qq].filter(t=>tt.has(t)).length;const score=inter/Math.max(qq.size,tt.size||1);if(score>best.score)best={name:e.name,score};});
  return best.score>=0.55?best.name:q;
}
function parseWorkoutSheet(text){
  const lines=String(text||'').split(/\r?\n/).map(normOCR).filter(Boolean); let workouts=[];let current={name:'Allenamento 1',exercises:[]};let seen=false;
  lines.forEach(line=>{if(isWorkoutHeading(line)){if(current.exercises.length){workouts.push(current);current={name:line,exercises:[]};}else current.name=line;return;}const ex=parseExerciseLine(line);if(ex){ex.name=bestExerciseName(ex.name);current.exercises.push(ex);seen=true;}});
  if(current.exercises.length||!workouts.length)workouts.push(current);
  workouts=workouts.filter(w=>w.exercises.length||workouts.length===1).map((w,i)=>{w.name=(w.name||`Allenamento ${i+1}`).replace(/^[-: ]+/,'').trim()||`Allenamento ${i+1}`;return w;});
  return {workouts,seen};
}
async function runWorkoutOCR(file){
  if(!file)return;
  const status=document.getElementById('ocrReview'); if(status)status.innerHTML='';
  const preview=document.getElementById('ocrPreview'); if(preview)preview.innerHTML=`<img class="content-image" src="${esc(await resizeImageFile(file,1500,.88))}" alt="Scheda fotografata">`;
  try{
    ocrStatus('Caricamento del riconoscimento testo…',8);const T=await loadTesseract();ocrStatus('Leggo la scheda…',18);
    const worker=await T.createWorker('ita');
    const image=await resizeImageFile(file,2200,.9);
    const result=await worker.recognize(image);const text=result?.data?.text||'';await worker.terminate();
    ocrStatus('Testo letto. Preparo la scheda modificabile…',100);showOCRReview(text);
  }catch(e){console.error(e);ocrStatus('Non riesco a leggere questa immagine. Puoi comunque incollare o correggere il testo manualmente.',0);showOCRReview('');}
}
function showOCRReview(text){
  const parsed=parseWorkoutSheet(text); window.ocrDraft={programName:'Scheda importata · '+new Date().toLocaleDateString('it-IT'),description:'Importata da foto',workouts:parsed.workouts,raw:text};
  renderOCRReview();
}
function renderOCRReview(){
  const d=window.ocrDraft;if(!d)return;let html=`<div class="section-title"><h3>Controlla prima di importare</h3><span class="chip ${d.workouts.some(w=>w.exercises.some(e=>e.needsReview))?'red':'green'}">${d.workouts.reduce((n,w)=>n+w.exercises.length,0)} esercizi</span></div><div class="grid2"><div><span class="mini-label">Nome nuova scheda</span><input id="ocrProgName" value="${esc(d.programName)}"></div><div><span class="mini-label">Descrizione</span><input id="ocrProgDesc" value="${esc(d.description)}"></div></div>`;
  html+=`<div class="card" style="margin-top:10px"><div class="row between"><b>Testo riconosciuto</b><button class="btn light small" onclick="reparseOCRText()">Rianalizza</button></div><textarea id="ocrRaw" class="ocr-raw" rows="7" style="margin-top:8px">${esc(d.raw||'')}</textarea><div class="muted" style="margin-top:6px">Se qualcosa è stato letto male, correggilo qui e premi “Rianalizza”, oppure modifica direttamente i campi sotto.</div></div>`;
  d.workouts.forEach((w,wi)=>{html+=`<div class="import-workout"><div class="row between"><input id="ocrWName_${wi}" value="${esc(w.name)}" style="flex:1;font-weight:800"><button class="icon-btn danger" onclick="removeOCRWorkout(${wi})">🗑</button></div><div id="ocrExercises_${wi}" style="margin-top:8px">${w.exercises.map((e,ei)=>ocrExerciseRow(wi,ei,e)).join('')}</div><div class="row" style="margin-top:9px"><button class="btn light small" onclick="addOCRExercise(${wi})">+ Esercizio</button><button class="btn light small" onclick="addOCRWorkoutAfter(${wi})">+ Allenamento</button></div></div>`;});
  html+=`<div class="row" style="margin-top:10px"><button class="btn green grow" onclick="confirmOCRImport()">✓ Importa nella mia app</button><button class="btn light" onclick="closeModal()">Annulla</button></div>`;
  document.getElementById('ocrReview').innerHTML=html;
}
function ocrExerciseRow(wi,ei,e){return `<div class="import-row"><div><input id="ocrName_${wi}_${ei}" value="${esc(e.name)}" placeholder="Nome esercizio"><div class="mini muted">${e.needsReview?'⚠ Controlla questo esercizio':''}</div></div><input id="ocrSets_${wi}_${ei}" type="number" min="1" max="50" value="${e.sets}" placeholder="Serie"><input id="ocrMin_${wi}_${ei}" type="number" min="1" max="100" value="${e.min}" placeholder="Min"><input id="ocrMax_${wi}_${ei}" type="number" min="1" max="100" value="${e.max}" placeholder="Max"><input id="ocrRest_${wi}_${ei}" value="${esc(e.rest)}" placeholder="Rec."><input id="ocrTech_${wi}_${ei}" value="${esc(e.tech||'')}" placeholder="Tecnica/note"><button class="icon-btn danger" onclick="removeOCRExercise(${wi},${ei})">×</button></div>`;}
function syncOCRDraft(){const d=window.ocrDraft;if(!d)return;d.programName=(document.getElementById('ocrProgName')?.value||d.programName).trim();d.description=(document.getElementById('ocrProgDesc')?.value||d.description).trim();d.workouts.forEach((w,wi)=>{w.name=(document.getElementById('ocrWName_'+wi)?.value||w.name).trim()||`Allenamento ${wi+1}`;w.exercises.forEach((e,ei)=>{e.name=(document.getElementById(`ocrName_${wi}_${ei}`)?.value||e.name).trim();e.sets=Math.max(1,parseInt(document.getElementById(`ocrSets_${wi}_${ei}`)?.value||3,10));e.min=Math.max(1,parseInt(document.getElementById(`ocrMin_${wi}_${ei}`)?.value||8,10));e.max=Math.max(e.min,parseInt(document.getElementById(`ocrMax_${wi}_${ei}`)?.value||e.min,10));e.rest=(document.getElementById(`ocrRest_${wi}_${ei}`)?.value||'1:30').trim();e.tech=(document.getElementById(`ocrTech_${wi}_${ei}`)?.value||'').trim();});});}
function reparseOCRText(){syncOCRDraft();const raw=document.getElementById('ocrRaw')?.value||'';const parsed=parseWorkoutSheet(raw);window.ocrDraft.workouts=parsed.workouts;window.ocrDraft.raw=raw;renderOCRReview();toast('Testo rianalizzato');}
function removeOCRExercise(wi,ei){syncOCRDraft();window.ocrDraft.workouts[wi].exercises.splice(ei,1);renderOCRReview();}
function addOCRExercise(wi){syncOCRDraft();window.ocrDraft.workouts[wi].exercises.push({name:'Nuovo esercizio',sets:3,min:8,max:12,rest:'1:30',tech:'',note:'',needsReview:true});renderOCRReview();}
function addOCRWorkoutAfter(wi){syncOCRDraft();window.ocrDraft.workouts.splice(wi+1,0,{name:`Allenamento ${window.ocrDraft.workouts.length+1}`,exercises:[]});renderOCRReview();}
function removeOCRWorkout(wi){syncOCRDraft();if(window.ocrDraft.workouts.length<=1){toast('Deve rimanere almeno un allenamento');return;}window.ocrDraft.workouts.splice(wi,1);renderOCRReview();}
function ensureImportedExercise(name){const n=String(name||'').trim();if(!n)return;const exists=allExercises().some(e=>e.name.toLowerCase()===n.toLowerCase());if(exists)return;const id='ocr'+Date.now()+Math.random().toString(36).slice(2,7);state.customExercises.push({id,name:n,muscle:'Altro',equipment:'Personalizzato'});state.exerciseMeta[n]=state.exerciseMeta[n]||{};state.exerciseMeta[n].note='Importato da scheda fotografata';}
function confirmOCRImport(){syncOCRDraft();const d=window.ocrDraft;if(!d)return;if(!d.programName){toast('Inserisci un nome per la scheda');return;}d.workouts=d.workouts.filter(w=>w.name||w.exercises.length);d.workouts.forEach((w,wi)=>{w.name=w.name||`Allenamento ${wi+1}`;w.exercises=w.exercises.filter(e=>e.name).map(e=>{ensureImportedExercise(e.name);return [e.name,e.sets,e.min,e.max,e.rest,e.tech||''];});});if(!d.workouts.length){toast('Nessun allenamento da importare');return;}if(state.programs[d.programName]){d.programName=d.programName+' · '+new Date().toLocaleDateString('it-IT');}state.programs[d.programName]={description:d.description||'Importata da foto',note:'',image:'',workouts:d.workouts};state.currentProgram=d.programName;state.currentWorkout=0;save();window.ocrDraft=null;closeModal();go('more');toast('Nuova scheda importata e pronta da modificare');}

}
function selectProgram(name){if(!state.programs[name])return;state.currentProgram=name;state.currentWorkout=0;save();toast('Programma attivo');renderMore();}
function showProgram(name){const p=state.programs[name];if(!p)return;document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="sheet"><div class="handle"></div><div class="row between"><h2>${esc(name)}</h2><button class="btn light small" onclick="closeModal()">Chiudi</button></div><div class="muted">${esc(p.description||'Programma personalizzato')}</div>${p.workouts.map((w,wi)=>`<div class="section-title"><h3>${esc(w.name)}</h3><span class="chip">${w.exercises.length} esercizi</span></div><div class="card">${w.exercises.map(e=>exerciseRow(e,`openExercise(${JSON.stringify(e[0]).replace(/"/g,'&quot;')})`,true)).join('')}</div>`).join('')}</div></div>`;}
function newProgram(){
const n=prompt('Nome del nuovo programma, es. Allenamento giornaliero');
if(!n||!n.trim())return;
const name=n.trim();
if(state.programs[name]){toast('Esiste già un programma con questo nome');return;}
state.programs[name]={description:'Programma personalizzato',workouts:[{name:'Allenamento 1',exercises:[]}]};
state.currentProgram=name;state.currentWorkout=0;save();toast('Programma creato');editProgram(name);
}
function layoutEditorHtml(layout){const l=normalizeLayout(layout),items=[['showSets','Serie'],['showKg','Colonna Kg / peso'],['showReps','Colonna ripetizioni'],['showDone','Colonna completamento ✓'],['showRest','Recupero'],['showPrevious','Ultima volta'],['showTechnique','Tecnica / note esercizio'],['showNotes','Note personali'],['showImages','Immagini esercizi'],['showTimer','Timer recupero']];return `<div class="card settings-card"><div class="muted" style="margin-bottom:8px">Puoi nascondere completamente qualsiasi colonna senza perdere lo storico già salvato.</div><div class="settings-grid">${items.map(([k,label])=>`<label class="toggle" style="margin:0"><span>${label}</span><input type="checkbox" id="layout_${k}" ${l[k]?'checked':''} style="width:20px;height:20px"></label>`).join('')}</div><div class="section-title" style="margin-top:12px"><h3>Etichette personalizzate</h3></div><div class="grid2"><div><span class="mini-label">Serie</span><input id="label_sets" value="${esc(l.labels.sets)}"></div><div><span class="mini-label">Peso</span><input id="label_kg" value="${esc(l.labels.kg)}"></div><div><span class="mini-label">Ripetizioni</span><input id="label_reps" value="${esc(l.labels.reps)}"></div><div><span class="mini-label">Completamento</span><input id="label_done" value="${esc(l.labels.done)}"></div></div></div>`;}function readLayoutEditor(old){const l=normalizeLayout(old),keys=['showSets','showKg','showReps','showDone','showRest','showPrevious','showTechnique','showNotes','showImages','showTimer'];keys.forEach(k=>{const el=document.getElementById('layout_'+k);if(el)l[k]=!!el.checked;});l.labels={sets:(document.getElementById('label_sets')?.value||'Serie').trim()||'Serie',kg:(document.getElementById('label_kg')?.value||'Kg').trim()||'Kg',reps:(document.getElementById('label_reps')?.value||'Rip.').trim()||'Rip.',done:(document.getElementById('label_done')?.value||'✓').trim()||'✓'};return l;}function editProgram(name){
const p=state.programs[name];if(!p)return;
editingProgramName=name;
const safe=JSON.stringify(name).replace(/"/g,'&quot;');
const workoutHtml=p.workouts.map((w,wi)=>`<div class="card program-editor">${imageTag(w.image,'content-image',w.name)}<div class="row between"><div class="grow"><input id="wname_${wi}" value="${esc(w.name)}" placeholder="Nome allenamento"></div><div class="editor-actions"><button class="icon-btn" onclick="moveWorkout(${wi},-1)" ${wi===0?'disabled':''}>↑</button><button class="icon-btn" onclick="moveWorkout(${wi},1)" ${wi===p.workouts.length-1?'disabled':''}>↓</button><button class="icon-btn danger" onclick="deleteWorkout(${wi})">🗑</button></div></div><div class="grid2" style="margin-top:9px"><div><span class="mini-label">Note allenamento</span><textarea id="wnote_${wi}" rows="2" placeholder="Obiettivo, riscaldamento, indicazioni…">${esc(w.note||'')}</textarea></div><div><span class="mini-label">Immagine allenamento</span><input type="file" accept="image/*" onchange="uploadWorkoutImage(this,editingProgramName||state.currentProgram,${wi})"><button class="btn light small" style="margin-top:6px" onclick="clearWorkoutImage(${wi})">Rimuovi immagine</button></div></div><div class="muted" style="margin:8px 0">${w.exercises.length} esercizi · ${w.exercises.reduce((a,e)=>a+Number(e[1]||0),0)} serie</div>${w.exercises.map((e,ei)=>`<div class="editor-exercise"><div><b>${esc(e[0])}</b><div class="muted">${e[1]} serie · ${e[2]}–${e[3]} reps · recupero ${esc(e[4])}${e[5]?` · ${esc(e[5])}`:''}</div></div><div class="editor-actions"><button class="icon-btn" onclick="moveExercise(${wi},${ei},-1)" ${ei===0?'disabled':''}>↑</button><button class="icon-btn" onclick="moveExercise(${wi},${ei},1)" ${ei===w.exercises.length-1?'disabled':''}>↓</button><button class="icon-btn" onclick="editExerciseInWorkout(${wi},${ei})">✎</button><button class="icon-btn danger" onclick="removeExerciseFromWorkout(${wi},${ei})">🗑</button></div></div>`).join('')||'<div class="empty" style="padding:16px">Nessun esercizio. Tocca “+ Aggiungi esercizio”.</div>'}<div class="row" style="margin-top:10px"><button class="btn light grow" onclick="openExercisePicker(${wi})">+ Aggiungi esercizio</button></div></div>`).join('');
document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="sheet"><div class="handle"></div><div class="row between"><div><h2>Modifica programma</h2><div class="muted">${esc(name)}</div></div><button class="btn light small" onclick="closeModal()">Chiudi</button></div><div class="section-title"><h3>Nome e descrizione</h3></div><div class="grid2"><div><span class="mini-label">Nome programma</span><input id="progName" value="${esc(name)}"></div><div><span class="mini-label">Descrizione</span><input id="progDesc" value="${esc(p.description||'')}"></div></div><div style="margin-top:10px"><span class="mini-label">Note programma</span><textarea id="progNote" rows="2" placeholder="Obiettivi, durata, indicazioni…">${esc(p.note||'')}</textarea></div><div class="grid2" style="margin-top:9px"><div><span class="mini-label">Immagine programma</span><input type="file" accept="image/*" onchange="uploadProgramImage(this,editingProgramName||state.currentProgram)"></div><div><span class="mini-label">Gestione immagine</span><button class="btn light small" onclick="clearProgramImage()">Rimuovi immagine</button></div></div><div class="section-title"><h3>Campi della scheda</h3></div>${layoutEditorHtml(p.layout)}<div class="section-title"><h3>Allenamenti</h3><button class="btn small" onclick="addWorkout()">+ Allenamento</button></div><div class="drag-note">Puoi spostare gli allenamenti e gli esercizi con ↑ ↓.</div>${workoutHtml}<div class="row" style="margin-top:12px"><button class="btn green grow" onclick="saveProgramEdits(${safe})">Salva modifiche</button><button class="btn light" onclick="deleteProgram(${safe})">Elimina programma</button></div></div></div>`;
}
function saveProgramEdits(originalName){
const p=state.programs[originalName];if(!p)return;
const newName=(document.getElementById('progName')?.value||originalName).trim();
if(!newName){toast('Inserisci un nome');return;}
if(newName!==originalName&&state.programs[newName]){toast('Esiste già un programma con questo nome');return;}
p.workouts.forEach((w,i)=>{const v=document.getElementById('wname_'+i)?.value.trim();if(v)w.name=v;w.note=document.getElementById('wnote_'+i)?.value.trim()||'';});
p.note=document.getElementById('progNote')?.value.trim()||'';
p.description=document.getElementById('progDesc')?.value.trim()||'Programma personalizzato';p.layout=readLayoutEditor(p.layout);
if(newName!==originalName){state.programs[newName]=p;delete state.programs[originalName];if(state.currentProgram===originalName)state.currentProgram=newName;}
state.currentWorkout=Math.min(state.currentWorkout||0,p.workouts.length-1);save();toast('Modifiche salvate');editProgram(newName);
}
function addWorkout(){const key=editingProgramName||state.currentProgram;const p=state.programs[key]||Object.values(state.programs)[0];if(!p)return;const n=prompt('Nome del nuovo allenamento','Allenamento '+(p.workouts.length+1));if(!n||!n.trim())return;p.workouts.push({name:n.trim(),exercises:[]});save();editProgram(key);}
function moveWorkout(i,dir){const key=editingProgramName||state.currentProgram;const p=state.programs[key];const j=i+dir;if(!p||j<0||j>=p.workouts.length)return;[p.workouts[i],p.workouts[j]]=[p.workouts[j],p.workouts[i]];if(state.currentWorkout===i)state.currentWorkout=j;else if(state.currentWorkout===j)state.currentWorkout=i;save();editProgram(key);}
function deleteWorkout(i){const key=editingProgramName||state.currentProgram;const p=state.programs[key];if(!p||p.workouts.length<=1){toast('Un programma deve avere almeno un allenamento');return;}if(!confirm('Eliminare questo allenamento e la sua configurazione?'))return;p.workouts.splice(i,1);state.currentWorkout=Math.min(state.currentWorkout,p.workouts.length-1);save();editProgram(key);}
function removeExerciseFromWorkout(wi,ei){const key=editingProgramName||state.currentProgram;const p=state.programs[key];if(!p)return;if(!confirm('Rimuovere questo esercizio dall’allenamento?'))return;p.workouts[wi].exercises.splice(ei,1);save();editProgram(key);}
function moveExercise(wi,ei,dir){const key=editingProgramName||state.currentProgram;const p=state.programs[key],a=p?.workouts?.[wi]?.exercises,j=ei+dir;if(!a||j<0||j>=a.length)return;[a[ei],a[j]]=[a[j],a[ei]];save();editProgram(key);}
function openExercisePicker(wi){
const key=editingProgramName||state.currentProgram;const p=state.programs[key];if(!p)return;
const used=new Set(p.workouts[wi].exercises.map(e=>e[0]));
const arr=allExercises();
document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="sheet"><div class="handle"></div><div class="row between"><h2>Aggiungi esercizio</h2><button class="btn light small" onclick="editProgram(editingProgramName||state.currentProgram)">Indietro</button></div><div class="search"><span>⌕</span><input id="pickerSearch" placeholder="Cerca nella libreria…" oninput="filterExercisePicker(${wi})"></div><div id="pickerList" class="exercise-picker">${arr.map((e,i)=>`<div class="picker-item" data-name="${esc(e.name.toLowerCase())}"><div class="thumb">${thumb(e.name)}</div><div class="grow"><b>${esc(e.name)}</b><div class="muted">${esc(e.muscle)} · ${esc(e.equipment)}</div></div><button class="btn small ${used.has(e.name)?'light':'red'}" onclick="addPickedExercise(${wi},${i})">${used.has(e.name)?'Usato':'Aggiungi'}</button></div>`).join('')}</div></div></div>`;
}
function filterExercisePicker(wi){const q=(document.getElementById('pickerSearch')?.value||'').toLowerCase();document.querySelectorAll('#pickerList .picker-item').forEach(x=>x.style.display=x.dataset.name.includes(q)?'flex':'none');}
function addPickedExercise(wi,libIndex){const key=editingProgramName||state.currentProgram;const arr=allExercises(),e=arr[libIndex],p=state.programs[key];if(!e||!p)return;const w=p.workouts[wi];if(w.exercises.some(x=>x[0]===e.name)){toast('Esercizio già presente');return;}w.exercises.push([e.name,3,8,12,'1:30','']);save();editExerciseInWorkout(wi,w.exercises.length-1,true);}
function editExerciseInWorkout(wi,ei,justAdded=false){const key=editingProgramName||state.currentProgram;const p=state.programs[key],e=p?.workouts?.[wi]?.exercises?.[ei];if(!e)return;document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="sheet"><div class="handle"></div><div class="row between"><h2>${justAdded?'Configura esercizio':'Modifica esercizio'}</h2><button class="btn light small" onclick="editProgram(editingProgramName||state.currentProgram)">Annulla</button></div><div class="muted">Puoi correggere anche il nome se l'OCR lo ha letto male.</div><div style="margin-top:8px"><span class="mini-label">Nome esercizio</span><input id="eeName" value="${esc(e[0])}"></div><div class="grid2" style="margin-top:12px"><div><span class="mini-label">Serie</span><input id="eeSets" type="number" min="1" max="50" value="${e[1]||3}"></div><div><span class="mini-label">Recupero</span><input id="eeRest" value="${esc(e[4]||'1:30')}" placeholder="es. 100 s o 1:30"></div><div><span class="mini-label">Reps min</span><input id="eeMin" type="number" min="1" max="100" value="${e[2]||8}"></div><div><span class="mini-label">Reps max</span><input id="eeMax" type="number" min="1" max="100" value="${e[3]||e[2]||12}"></div></div><div style="margin-top:10px"><span class="mini-label">Tecnica / note</span><input id="eeTech" value="${esc(e[5]||'')}" placeholder="es. Drop set ultima, Rest-pause, Superset…"></div><div style="margin-top:10px"><span class="mini-label">Nota personale esercizio</span><textarea id="eeNote" rows="3" placeholder="Esecuzione, carico target, sensazioni, accorgimenti…">${esc(exerciseInfo(e[0]).note||'')}</textarea></div><div style="margin-top:10px"><span class="mini-label">Immagine personale esercizio</span>${imageTag(exerciseImage(e[0]),'image-preview',e[0])}<input type="file" accept="image/*" onchange="uploadExerciseImage(this,${JSON.stringify(e[0])},${wi},${ei})"><button class="btn light small" style="margin-top:6px" onclick="clearExerciseImage(${JSON.stringify(e[0])},${wi},${ei})">Rimuovi immagine</button></div><div class="row" style="margin-top:14px"><button class="btn light grow" onclick="editProgram(editingProgramName||state.currentProgram)">Annulla</button><button class="btn green grow" onclick="saveExerciseInWorkout(${wi},${ei})">Salva esercizio</button></div></div></div>`;}
function saveExerciseInWorkout(wi,ei){const key=editingProgramName||state.currentProgram;const p=state.programs[key],e=p?.workouts?.[wi]?.exercises?.[ei];if(!e)return;const oldName=e[0],newName=(document.getElementById('eeName')?.value||oldName).trim();if(!newName){toast('Inserisci il nome dell\'esercizio');return;}if(newName!==oldName&&p.workouts[wi].exercises.some((x,j)=>j!==ei&&x[0]===newName)){toast('Questo esercizio è già presente');return;}const sets=Math.max(1,Math.min(50,parseInt(document.getElementById('eeSets')?.value||3,10)));const min=Math.max(1,parseInt(document.getElementById('eeMin')?.value||8,10));const max=Math.max(min,parseInt(document.getElementById('eeMax')?.value||min,10));e[0]=newName;e[1]=sets;e[2]=min;e[3]=max;e[4]=(document.getElementById('eeRest')?.value||'1:30').trim();e[5]=(document.getElementById('eeTech')?.value||'').trim();state.exerciseMeta[newName]=state.exerciseMeta[oldName]||{};state.exerciseMeta[newName].note=(document.getElementById('eeNote')?.value||'').trim();if(newName!==oldName){state.logs.forEach(x=>{if(x.program===key&&x.exercise===oldName)x.exercise=newName;});if(state.exerciseMeta[oldName])delete state.exerciseMeta[oldName];}save();toast('Esercizio aggiornato');editProgram(key);}
function deleteProgram(name){if(Object.keys(state.programs).length<=1){toast('Deve rimanere almeno un programma');return;}if(!confirm('Eliminare definitivamente questo programma?'))return;delete state.programs[name];if(state.currentProgram===name){state.currentProgram=Object.keys(state.programs)[0];state.currentWorkout=0;}save();closeModal();renderMore();toast('Programma eliminato');}
async function uploadProgramImage(input,name){const f=input?.files?.[0];if(!f)return;const p=state.programs[name];if(!p)return;p.image=await resizeImageFile(f);save();toast('Immagine programma salvata');editProgram(name);}
async function uploadWorkoutImage(input,name,wi){const f=input?.files?.[0];if(!f)return;const p=state.programs[name];if(!p?.workouts?.[wi])return;p.workouts[wi].image=await resizeImageFile(f);save();toast('Immagine allenamento salvata');editProgram(name);}
function clearProgramImage(){const name=editingProgramName||state.currentProgram;if(state.programs[name]){state.programs[name].image='';save();editProgram(name);}}
function clearWorkoutImage(wi){const name=editingProgramName||state.currentProgram;if(state.programs[name]?.workouts?.[wi]){state.programs[name].workouts[wi].image='';save();editProgram(name);}}
async function uploadExerciseImage(input,name,wi,ei){const f=input?.files?.[0];if(!f)return;state.exerciseMeta[name]=state.exerciseMeta[name]||{};state.exerciseMeta[name].image=await resizeImageFile(f);save();toast('Immagine esercizio salvata');editExerciseInWorkout(wi,ei);}
function clearExerciseImage(name,wi,ei){if(state.exerciseMeta[name]){delete state.exerciseMeta[name].image;save();editExerciseInWorkout(wi,ei);}}
function openSettings(){document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="sheet"><div class="handle"></div><div class="row between"><h2>Impostazioni</h2><button class="btn light small" onclick="closeModal()">Chiudi</button></div><div class="toggle"><span>Recupero automatico</span><button class="switch ${state.autoRest?'on':''}" onclick="state.autoRest=!state.autoRest;save();openSettings()"><i></i></button></div>
<div class="section-title"><h3>Recupero personalizzato</h3></div>
<div class="row"><input id="settingsRest" type="number" min="1" max="3600" step="1" inputmode="numeric" value="${state.customRest||100}" placeholder="Secondi"><button class="btn red" onclick="saveCustomRest()">Salva</button></div>
<div class="muted" style="margin-top:7px">I pulsanti rapidi 60/90/120/150 s restano disponibili. Qui puoi impostare qualsiasi valore in secondi.</div>
<div class="toggle"><span>Dati salvati sul dispositivo</span><span class="chip green">Locale</span></div><div class="muted" style="margin-top:12px">Esporta periodicamente un backup prima di cambiare dispositivo o browser.</div><div class="section-title"><h3>Personalizzazione completa</h3></div><div class="settings-grid"><button class="settings-card" onclick="closeModal();go('more')"><b>🏋️ Programmi</b><span class="muted">Tutto: nomi, immagini, note, esercizi, serie, Kg, ripetizioni, colonne e timer.</span></button><button class="settings-card" onclick="closeModal();go('library')"><b>🖼️ Esercizi</b><span class="muted">Immagini personali, note, muscolo, attrezzatura ed esercizi nuovi.</span></button></div><div class="muted" style="margin-top:10px">Le immagini vengono ridotte e salvate localmente sul tuo iPhone. Usa Backup prima di cancellare i dati del sito.</div></div></div>`;}
function saveCustomRest(){
const n=Math.max(1,Math.min(3600,parseInt(document.getElementById('settingsRest')?.value||100,10)));
state.customRest=n;save();toast('Recupero personalizzato salvato: '+n+' s');openSettings();
}
function exportBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='gm-fitness-pro-backup.json';a.click();toast('Backup esportato');}
function importBackup(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.logs||!x.programs)throw 0;state=x;save();go('home');toast('Backup importato');}catch(e){toast('Backup non valido');}};r.readAsText(f);}
save();go('home');
</script>
</body></html>
